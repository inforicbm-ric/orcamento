<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrçaFácil</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81" id="themeMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="app-version" content="2.1.3">

  <style>
    :root {
      --primary-50: #eef2ff; --primary-100: #e0e7ff; --primary-200: #c7d2fe; --primary-300: #a5b4fc;
      --primary-400: #818cf8; --primary-500: #6366f1; --primary-600: #4f46e5; --primary-700: #4338ca;
      --primary-800: #3730a3; --primary-900: #312e81; --primary-950: #1e1b4b;
      --bg: #0c0c14; --surface: #13131f; --surface-raised: #1a1a2e; --surface-hover: #22223a; --surface-muted: #0f0f1a;
      --border: #252540; --border-light: #2e2e50; --text: #f0f0ff; --text-secondary: #9ca3af;
      --text-muted: #6b7280; --text-inverse: #ffffff;
      --danger: #ef4444; --danger-soft: rgba(239,68,68,0.12);
      --success: #10b981; --success-soft: rgba(16,185,129,0.12);
      --warning: #f59e0b; --warning-soft: rgba(245,158,11,0.12);
      --info: #0ea5e9; --info-soft: rgba(14,165,233,0.12);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4); --shadow-sm: 0 2px 8px rgba(0,0,0,0.2); --shadow-fab: 0 6px 20px rgba(79,70,229,0.35);
    }
    [data-theme="light"] {
      --bg: #f8f7ff; --surface: #ffffff; --surface-raised: #f0eeff; --surface-hover: #e8e5ff; --surface-muted: #faf9ff;
      --border: #e2dfff; --border-light: #ede9ff; --text: #1e1b4b; --text-secondary: #6b66a0;
      --text-muted: #a09cc0; --text-inverse: #1e1b4b;
      --shadow: 0 4px 24px rgba(99,102,241,0.08); --shadow-sm: 0 2px 8px rgba(99,102,241,0.06); --shadow-fab: 0 6px 20px rgba(79,70,229,0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 80px; }

    .hero { background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 50%, var(--primary-600) 100%); color: #fff; padding: 16px 16px 120px; position: relative; overflow: hidden; }
    .hero-compact { background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 50%, var(--primary-600) 100%); color: #fff; padding: 16px 16px 80px; position: relative; overflow: hidden; }
    .hero-compact::before, .hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%); pointer-events: none; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; position: relative; z-index: 1; }
    .hero-date { font-size: 11px; font-weight: 500; opacity: 0.8; letter-spacing: 0.3px; }
    .hero-actions { display: flex; gap: 8px; align-items: center; }
    .hero-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; backdrop-filter: blur(8px); }
    .hero-btn:hover { background: rgba(255,255,255,0.15); }
    .hero-btn svg { width: 16px; height: 16px; }
    .hero-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; position: relative; z-index: 1; }
    .hero-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; position: relative; z-index: 1; }

    .search-wrap { padding: 0 16px; margin-top: -100px; position: relative; z-index: 2; margin-bottom: 12px; }
    .search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-pill); padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); transition: all 0.15s; }
    .search-box:focus-within { border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-100); }
    [data-theme="dark"] .search-box:focus-within { box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .search-box svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
    .search-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear { width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--border); color: var(--text-muted); cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .search-clear.visible { display: flex; }

    .chips-wrap { display: flex; gap: 8px; padding: 8px 16px 10px; overflow-x: auto; scrollbar-width: none; }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip { padding: 7px 16px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.15s; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-secondary); flex-shrink: 0; }
    .chip:hover { border-color: var(--primary-400); color: var(--primary-500); }
    .chip.active { background: var(--primary-600); color: #fff; border-color: var(--primary-600); box-shadow: 0 2px 8px rgba(79,70,229,0.25); }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; position: relative; z-index: 2; margin-bottom: 16px; }
    .stat-box { border-radius: var(--radius-md); padding: 14px 6px; text-align: center; border: 1.5px solid var(--border); background: var(--surface); transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-box:hover { border-color: var(--primary-400); }
    .stat-value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--primary-600); }
    [data-theme="dark"] .stat-value { color: var(--primary-400); }
    .stat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; color: var(--text-muted); }

    .section-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.7px; padding: 16px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
    .section-title a { color: var(--primary-600); font-size: 12px; text-transform: none; letter-spacing: 0; cursor: pointer; font-weight: 700; }
    [data-theme="dark"] .section-title a { color: var(--primary-400); }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 10px; }
    .cat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
    .cat-card:hover { border-color: var(--primary-500); transform: translateY(-2px); box-shadow: var(--shadow); }
    .cat-card:active { transform: translateY(0); }
    .cat-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 22px; position: relative; }
    .cat-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-count { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .cat-price { font-size: 12px; font-weight: 800; margin-top: 6px; color: var(--primary-600); }
    [data-theme="dark"] .cat-price { color: var(--primary-400); }

    .recent-list { padding: 0 16px 10px; }
    .recent-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.1s; }
    .recent-item:last-child { border-bottom: none; }
    .recent-item:hover { opacity: 0.85; }
    .recent-rank { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; background: var(--surface-raised); color: var(--text-secondary); border: 1.5px solid var(--border); }
    .recent-rank.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; border: none; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .recent-rank.silver { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; border: none; }
    .recent-rank.bronze { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border: none; }
    .recent-info { flex: 1; min-width: 0; }
    .recent-prod { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .recent-loja { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .recent-price { font-size: 14px; font-weight: 800; flex-shrink: 0; color: var(--primary-600); }
    [data-theme="dark"] .recent-price { color: var(--primary-400); }

    .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
    .empty-title { font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-bottom: 3px; }
    .empty-text { font-size: 12px; }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 0 16px; background: var(--surface); border-top: 1px solid var(--border); z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: var(--radius-sm); transition: all 0.15s; border: none; background: transparent; font-family: inherit; }
    .nav-item:hover { color: var(--text-secondary); }
    .nav-item.active { color: var(--primary-600); }
    [data-theme="dark"] .nav-item.active { color: var(--primary-400); }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-fab { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); color: #fff; border: 3px solid var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-fab); transition: all 0.2s ease; margin-top: -20px; position: relative; }
    .nav-fab:hover { transform: scale(1.08); }
    .nav-fab:active { transform: scale(0.95); }
    .nav-fab svg { width: 22px; height: 22px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 300; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--surface); width: 100%; max-width: 480px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border: 1.5px solid var(--border); border-bottom: none; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 18px 18px 0; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 2; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-body { padding: 14px 18px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-100); }
    [data-theme="dark"] .form-input:focus, [data-theme="dark"] .form-select:focus, [data-theme="dark"] .form-textarea:focus { box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .form-textarea { min-height: 70px; resize: vertical; }
    .btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; background: var(--surface-raised); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
    .btn:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); color: #fff; box-shadow: 0 4px 16px rgba(79,70,229,0.3); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(79,70,229,0.4); transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; }
    .icon-btn { width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface-raised); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
    .icon-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--primary-400); }
    .icon-btn svg { width: 16px; height: 16px; }

    .cat-header { background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 100%); color: #fff; padding: 14px 16px 18px; }
    .cat-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cat-header-title { font-size: 18px; font-weight: 800; }
    .cat-header-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--surface); }
    .breadcrumb a { color: var(--primary-600); text-decoration: none; cursor: pointer; font-weight: 600; }
    [data-theme="dark"] .breadcrumb a { color: var(--primary-400); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-muted); }

    .tabs { display: flex; gap: 2px; margin: 0 16px; border-bottom: 1.5px solid var(--border); }
    .tab { padding: 10px 14px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; transition: all 0.15s; white-space: nowrap; background: transparent; border: none; border-bottom: 3px solid transparent; font-family: inherit; }
    .tab.active { color: var(--primary-600); border-bottom-color: var(--primary-600); }
    [data-theme="dark"] .tab.active { color: var(--primary-400); border-bottom-color: var(--primary-400); }
    .tab:hover:not(.active) { color: var(--text-secondary); }

    .prod-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin: 0 16px 8px; cursor: pointer; transition: all 0.15s ease; }
    .prod-card:hover { border-color: var(--primary-500); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .prod-card-header { display: flex; align-items: center; gap: 12px; }
    .prod-card-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .prod-card-title { font-size: 14px; font-weight: 700; }
    .prod-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .prod-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .prod-card-stat { font-size: 11px; color: var(--text-muted); }
    .prod-card-stat strong { color: var(--text); font-weight: 700; }
    .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 4px; }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-info { background: color-mix(in srgb, var(--primary-500) 12%, transparent); color: var(--primary-600); }
    [data-theme="dark"] .badge-info { background: color-mix(in srgb, var(--primary-400) 15%, transparent); color: var(--primary-400); }

    .orc-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin: 0 16px 8px; display: flex; align-items: center; gap: 10px; transition: all 0.15s; }
    .orc-item:hover { border-color: var(--primary-500); transform: translateX(2px); }
    .orc-item.best { border-color: var(--success); background: var(--success-soft); box-shadow: 0 0 12px rgba(16,185,129,0.1); }
    .orc-item.indisponivel { opacity: 0.55; border-color: var(--border); background: var(--surface-muted); }
    .orc-item.indisponivel .orc-preco { color: var(--text-muted); text-decoration: line-through; }
    .orc-item.comprado { border-color: var(--success); box-shadow: 0 0 0 1px rgba(16,185,129,0.3), 0 4px 12px rgba(16,185,129,0.08); }
    .orc-item.comprado .orc-preco { color: var(--success); }
    .orc-rank { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; background: var(--surface-raised); color: var(--text-secondary); border: 1.5px solid var(--border); }
    .orc-rank.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; border: none; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .orc-rank.silver { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; border: none; }
    .orc-rank.bronze { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border: none; }
    .orc-info { flex: 1; min-width: 0; }
    .orc-forn { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .orc-detalhes { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .orc-preco { font-size: 15px; font-weight: 800; white-space: nowrap; }
    .orc-preco.best { color: var(--success); }
    .orc-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .orc-item:hover .orc-actions { opacity: 1; }
    .orc-actions .icon-btn { width: 28px; height: 28px; }
    .selo-comprado { font-size: 10px; font-weight: 800; color: var(--success); background: var(--success-soft); padding: 2px 8px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; vertical-align: middle; }

    .forn-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 11px 14px; margin: 0 16px 8px; display: flex; align-items: center; gap: 10px; transition: all 0.15s; }
    .forn-item:hover { border-color: var(--primary-500); transform: translateX(2px); }
    .forn-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: #fff; }
    .forn-info { flex: 1; min-width: 0; }
    .forn-nome { font-size: 13px; font-weight: 700; }
    .forn-contato { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .forn-actions { display: flex; gap: 3px; opacity: 0; transition: opacity 0.15s; }
    .forn-item:hover .forn-actions { opacity: 1; }

    .forn-faltante { background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin: 0 16px 8px; display: flex; align-items: center; gap: 10px; opacity: 0.7; }
    .forn-faltante .forn-icon { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; color: var(--text-muted); }
    .forn-faltante .forn-nome { font-size: 13px; font-weight: 600; color: var(--text-muted); }

    .toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: 90%; max-width: 400px; }
    .toast { background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); pointer-events: auto; animation: toastIn 0.3s ease; display: flex; align-items: center; gap: 8px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .toast-icon { font-size: 16px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (min-width: 768px) { .app { max-width: 520px; } .bottom-nav { max-width: 520px; } }

    const CATEGORIA_ICONS = {

    let state = { view: 'home', categoriaId: null, produtoId: null, tab: 'produtos' };
    let navHistory = [];

    function pushHistory(view, categoriaId, produtoId, tab) {
      const stateObj = { view, categoriaId, produtoId, tab };
      navHistory.push(stateObj);
      history.pushState(stateObj, '', '');
    }

    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view) {
        navHistory.pop();
        const prev = navHistory[navHistory.length - 1];
        if (prev) { state = { ...prev }; refreshCurrentView(); }
        else { state = { view: 'home', categoriaId: null, produtoId: null, tab: 'produtos' }; renderHome(); }
      }
    });

    function getTheme() { return localStorage.getItem('orcafacil-theme') || 'dark'; }
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('orcafacil-theme', theme);
      const meta = document.getElementById('themeMeta');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8f7ff' : '#0c0c14');
    }
    function toggleTheme() {
      const current = getTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      setTheme(next);
      refreshCurrentView();
    }
    setTheme(getTheme());

    function normalize(str) {
      return str.toString().toLowerCase().normalize('NFD').replace(/[̀-̏]/g, '').replace(/[^a-z0-9\s]/g, '').trim();
    }
    function searchMatches(query, text) {
      const q = normalize(query); const t = normalize(text);
      return q.split(/\s+/).every(part => t.includes(part));
    }

    function formatMoney(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
    function formatOrcPreco(o) { return o.indisponivel ? '—' : formatMoney(o.preco); }
    function formatDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    }
    function getHoje() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }
    function getDataExtenso() {
      const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
      const now = new Date();
      return `${dias[now.getDay()]} ${String(now.getDate()).padStart(2,'0')}/${meses[now.getMonth()]}/${String(now.getFullYear()).slice(-2)}`;
    }

    function toast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast';
      const icons = { success: '✅', danger: '❌', warning: '⚠️', info: 'ℹ️' };
      el.innerHTML = `<span class="toast-icon">${icons[type] || 'ℹ️'}</span><span>${msg}</span>`;
      el.style.borderColor = type==='success'?'var(--success)':type==='danger'?'var(--danger)':type==='warning'?'var(--warning)':'var(--border)';
      c.appendChild(el);
      setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},2800);
    }
    function openModal(id) { const el = document.getElementById(id); if(el) el.classList.add('active'); document.body.style.overflow='hidden'; }
    function closeModal(id) { const el = document.getElementById(id); if(el) el.classList.remove('active'); document.body.style.overflow=''; }

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('categorias')) d.createObjectStore('categorias', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('produtos')) {
            const s = d.createObjectStore('produtos', { keyPath: 'id', autoIncrement: true });
            s.createIndex('categoriaId', 'categoriaId', { unique: false });
          }
          if (!d.objectStoreNames.contains('orcamentos')) {
            const s = d.createObjectStore('orcamentos', { keyPath: 'id', autoIncrement: true });
            s.createIndex('produtoId', 'produtoId', { unique: false });
          }
          if (!d.objectStoreNames.contains('fornecedores')) {
            const s = d.createObjectStore('fornecedores', { keyPath: 'id', autoIncrement: true });
            s.createIndex('categoriaId', 'categoriaId', { unique: false });
          }
        };
      });
    }
    function dbGetAll(store) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbGetByIndex(store, indexName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).index(indexName).getAll(value);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbAdd(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).add(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbPut(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbDelete(store, id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function seedData() {
      const cats = await dbGetAll('categorias');
      if (cats.length === 0) {
        const farmaciaId = await dbAdd('categorias', { nome: 'Farmácia', tipo: 'farmacia', descricao: 'Medicamentos e produtos de saúde', criadoEm: Date.now() });
        const construcaoId = await dbAdd('categorias', { nome: 'Construção', tipo: 'construcao', descricao: 'Materiais e ferramentas', criadoEm: Date.now() });
        const autoId = await dbAdd('categorias', { nome: 'Automotivo', tipo: 'automotivo', descricao: 'Peças e acessórios', criadoEm: Date.now() });
        const alimId = await dbAdd('categorias', { nome: 'Alimentação', tipo: 'alimentacao', descricao: 'Restaurantes e mercados', criadoEm: Date.now() });

        const farmacias = ['Drogaria São Paulo','Raia Drogasil','Pague Menos','Droga Raia','Farmácia Popular','Drogaria Extra','Ultrafarma','Panvel','Drogaria Venâncio','Farmácia Indiana','Drogaria Rosário','Farmácia Pague Bem','Drogaria Central','Farmácia Boa Vista','Drogaria União'];

    function filterHome(el, catId) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const cards = document.querySelectorAll('.cat-card');
      cards.forEach(card => {
        if (catId === null || parseInt(card.dataset.cat) === catId) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    }

    async function doSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const clearBtn = document.getElementById('searchClear');
      const homeContent = document.getElementById('homeContent');
      const container = document.getElementById('searchResults');
      clearBtn.classList.toggle('visible', query.length > 0);
      if (!query) {
        container.innerHTML = '';
        if (homeContent) homeContent.style.display = '';
        return;
      }
      if (homeContent) homeContent.style.display = 'none';
      const produtos = await dbGetAll('produtos');
      const categorias = await dbGetAll('categorias');
      const orcamentos = await dbGetAll('orcamentos');

      let results = produtos.filter(p => {
        return searchMatches(query, p.nome) || (p.descricao && searchMatches(query, p.descricao));
      });

      const orcsMatch = orcamentos.filter(o => searchMatches(query, o.fornecedor));
      for (const o of orcsMatch) {
        const prod = produtos.find(p => p.id === o.produtoId);
        if (prod && !results.some(r => r.id === prod.id)) {
          results.push(prod);
        }
      }

      if (results.length === 0) {
        container.innerHTML = `<div class="search-empty" style="margin:20px 16px;padding:30px;text-align:center;color:var(--text-muted);">🔍<br><br><strong style="color:var(--text-secondary)">Nenhum produto encontrado</strong><br><span style="font-size:12px">Tente outro termo de busca</span></div>`;
        return;
      }

      results = results.map(prod => {
        const prodOrcs = orcamentos.filter(o => o.produtoId === prod.id);
        let dataUltOrc = null;
        let dataUltOrcRaw = 0;
        if (prodOrcs.length > 0) {
          const ultOrc = [...prodOrcs].sort((a, b) => new Date(b.data || b.criadoEm) - new Date(a.data || a.criadoEm))[0];
          dataUltOrc = formatDate(ultOrc.data) || formatDate(new Date(ultOrc.criadoEm).toISOString().split('T')[0]);
          dataUltOrcRaw = new Date(ultOrc.data || ultOrc.criadoEm).getTime();
        }
        return { ...prod, _prodOrcs: prodOrcs, _dataUltOrc: dataUltOrc, _dataUltOrcRaw: dataUltOrcRaw };
      }).sort((a, b) => b._dataUltOrcRaw - a._dataUltOrcRaw);

      let html = '<div style="padding:8px 16px 16px;">';
      html += '<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;">Resultados da busca</div>';
      for (const prod of results) {
        const cat = categorias.find(c => c.id === prod.categoriaId);
        const menorPreco = prod._prodOrcs.length > 0 ? Math.min(...prod._prodOrcs.filter(o => !o.indisponivel).map(o => o.preco)) : null;
        const fornMatch = orcamentos.find(o => o.produtoId === prod.id && searchMatches(query, o.fornecedor));
        const info = cat ? (CATEGORIA_ICONS[cat.tipo] || CATEGORIA_ICONS.outros) : CATEGORIA_ICONS.outros;
        html += `
          <div class="search-result-item" style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--primary-500)'" onmouseout="this.style.borderColor='var(--border)'" onclick="navigate('produto', ${prod.categoriaId}, ${prod.id}); clearSearch()">
            <div class="search-result-icon" style="width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:${info.bg};color:${info.color}">${info.emoji}</div>
            <div class="search-result-info" style="flex:1;min-width:0;">
              <div class="search-result-name" style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);">${prod.nome}</div>
              <div class="search-result-meta" style="font-size:11px;color:var(--text-muted);">${cat ? cat.nome : ''}${prod.descricao ? ' · ' + prod.descricao : ''}${fornMatch ? ' · 🏪 ' + fornMatch.fornecedor : ''}${prod._dataUltOrc ? ' · 📅 ' + prod._dataUltOrc : ''}</div>
            </div>
            ${menorPreco !== null ? `<div class="search-result-price" style="font-size:14px;font-weight:800;color:var(--primary-600);white-space:nowrap;">${formatMoney(menorPreco)}</div>` : ''}
          </div>`;
      }
      html += '</div>';
      container.innerHTML = html;
    }

      const input = document.getElementById('searchInput');
      if (input) { input.value = ''; }

    async function renderProduto(categoriaId, produtoId) {
      const categoria = (await dbGetAll('categorias')).find(c => c.id === categoriaId);
      const produto = (await dbGetAll('produtos')).find(p => p.id === produtoId);
      if (!categoria || !produto) { navigate('home'); return; }
      const orcamentos = await dbGetByIndex('orcamentos', 'produtoId', produtoId);
      const fornecedores = await dbGetByIndex('fornecedores', 'categoriaId', categoriaId);
      const sorted = [...orcamentos].sort((a, b) => {
        if (a.indisponivel && !b.indisponivel) return 1;
        if (!a.indisponivel && b.indisponivel) return -1;
        if (a.indisponivel && b.indisponivel) return 0;
        return a.preco - b.preco;
      });
      const info = CATEGORIA_ICONS[categoria.tipo] || CATEGORIA_ICONS.outros;
      const hoje = getHoje();
      const themeIcon = getTheme() === 'dark' ? ICONS.sun : ICONS.moon;

      const fornsOrdenados = [...fornecedores].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      let fornOptions = '<option value="">-- Selecione uma loja --</option>';
      for (const f of fornsOrdenados) fornOptions += `<option value="${f.nome}">${f.nome}</option>`;
      fornOptions += '<option value="__outro__">✏️ Outro (digitar manualmente)</option>';

      let html = `
        <div class="prod-header">
          <div class="cat-header-top">
            <button class="hero-btn" onclick="navigate('categoria', ${categoriaId})">${ICONS.back}</button>
            <div class="hero-actions">
              <button class="hero-btn" onclick="toggleTheme()">${themeIcon}</button>
              <button class="hero-btn" onclick="openModal('modalEditProduto')">${ICONS.edit}</button>
              <button class="hero-btn" onclick="excluirProduto(${produto.id}, ${categoriaId})">${ICONS.trash}</button>
            </div>
          </div>
          <div class="cat-header-title" style="font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">${produto.nome}</div>
          <div class="cat-header-sub">${produto.descricao || ''}</div>
        </div>
        <div class="breadcrumb">
          <a onclick="navigate('home')">Início</a><span class="breadcrumb-sep">›</span>
          <a onclick="navigate('categoria', ${categoriaId})">${categoria.nome}</a><span class="breadcrumb-sep">›</span><span>${produto.nome}</span>
        </div>
        <div class="content">
      `;

      if (sorted.length > 0) {
        const disp = sorted.filter(o => !o.indisponivel);
        const menor = disp.length > 0 ? disp[0].preco : null;
        const maior = disp.length > 0 ? disp[disp.length - 1].preco : null;
        const economia = (menor !== null && maior !== null) ? maior - menor : 0;
        html += `
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-value">${menor !== null ? formatMoney(menor) : '—'}</div>
              <div class="stat-label">💚 Menor</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${maior !== null ? formatMoney(maior) : '—'}</div>
              <div class="stat-label">❤️ Maior</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${economia > 0 ? formatMoney(economia) : '—'}</div>
              <div class="stat-label">💰 Economia</div>
            </div>
          </div>`;
      }

      html += `<div class="section-title">Orçamentos (${sorted.length})</div>`;

      if (sorted.length === 0) {
        html += `<div class="empty"><div class="empty-icon">🏷️</div><div class="empty-title">Nenhum orçamento</div><div class="empty-text">Adicione orçamentos de diferentes fornecedores</div></div>`;
      } else {
        let dispIdx = 0;
        sorted.forEach((o, i) => {
          const isDisp = !o.indisponivel;
          const rank = isDisp ? (dispIdx === 0 ? 'gold' : dispIdx === 1 ? 'silver' : dispIdx === 2 ? 'bronze' : '') : '';
          const isBest = isDisp && dispIdx === 0;
          if (isDisp) dispIdx++;
          const compradoClass = o.comprado ? 'comprado' : '';
          const indisponivelClass = o.indisponivel ? 'indisponivel' : '';
          const rankText = o.indisponivel ? '❌' : (dispIdx === 1 ? '🥇' : dispIdx === 2 ? '🥈' : dispIdx === 3 ? '🥉' : dispIdx+'º');
          html += `
            <div class="orc-item ${isBest ? 'best' : ''} ${compradoClass} ${indisponivelClass}">
              <div class="orc-rank ${rank}">${rankText}</div>
              <div class="orc-info">
                <div class="orc-forn">${o.fornecedor}${o.comprado ? '<span class="selo-comprado">✅ Comprado</span>' : ''}</div>
                <div class="orc-detalhes">${o.indisponivel ? 'Produto indisponível nesta loja' : (o.quantidade > 1 ? o.quantidade + ' ' + produto.unidade + 's · ' : '') + formatDate(o.data) + (o.observacao ? ' · ' + o.observacao : '')}</div>
              </div>
              <div class="orc-preco ${isBest ? 'best' : ''}">${formatOrcPreco(o)}</div>
              <div class="orc-actions">
                ${!o.indisponivel ? `<button class="icon-btn" onclick="marcarComprado(${o.id}, ${categoriaId}, ${produtoId})" title="Marcar como comprado">${ICONS.check}</button>` : ''}
                <button class="icon-btn" onclick="editarOrcamento(${o.id}, ${categoriaId}, ${produtoId})" title="Editar">${ICONS.edit}</button>
                <button class="icon-btn" onclick="excluirOrcamento(${o.id}, ${categoriaId}, ${produtoId})" title="Excluir">${ICONS.trash}</button>
              </div>
            </div>`;
        });
      }

      // Lojas que faltam orçar
      const fornsComOrc = new Set(orcamentos.map(o => o.fornecedor));
      const faltantes = fornsOrdenados.filter(f => !fornsComOrc.has(f.nome));
      if (faltantes.length > 0) {
        html += `<div class="section-title" style="margin-top:8px;">🏪 Faltam orçar (${faltantes.length})</div>`;
        for (const f of faltantes) {
          html += `
            <div class="forn-faltante">
              <div class="forn-icon">🏪</div>
              <div class="forn-nome">${f.nome}</div>
            </div>`;
        }
      }

      html += `</div></div>`;
      html += renderBottomNav('home');

      html += `
        <div class="modal-overlay" id="modalOrcamento">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Novo Orçamento</div><button class="icon-btn" onclick="closeModal('modalOrcamento')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group"><label class="form-label">Fornecedor / Loja</label>
                <select class="form-select" id="orcFornecedorSelect" onchange="toggleFornecedorManual()">${fornOptions}</select>
              </div>
              <div class="form-group" id="orcFornManualGroup" style="display:none;">
                <label class="form-label">Digite o nome do fornecedor</label>
                <input class="form-input" id="orcFornecedorManual" placeholder="Ex: Drogaria Nova">
              </div>
              <div class="form-group form-check">
                <input type="checkbox" id="orcIndisponivel" onchange="toggleIndisponivel()">
                <label for="orcIndisponivel">Loja não tem o produto</label>
              </div>
              <div class="form-group" id="orcPrecoGroup">
                <label class="form-label">Preço (R$)</label>
                <input class="form-input" id="orcPreco" type="number" step="0.01" placeholder="0,00" inputmode="decimal">
              </div>
              <div class="form-group"><label class="form-label">Quantidade</label><input class="form-input" id="orcQtd" type="number" value="1" min="1"></div>
              <div class="form-group"><label class="form-label">Data do orçamento</label><input class="form-input" id="orcData" type="date" value="${hoje}"></div>
              <div class="form-group"><label class="form-label">Observação (opcional)</label><input class="form-input" id="orcObs" placeholder="Ex: Promoção válida até..."></div>
              <button class="btn btn-primary" onclick="salvarOrcamento(${produtoId}, ${categoriaId})">Salvar Orçamento</button>
            </div>
          </div>
        </div>`;

      html += `
        <div class="modal-overlay" id="modalEditProduto">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Editar Produto</div><button class="icon-btn" onclick="closeModal('modalEditProduto')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="editProdNome" value="${produto.nome}"></div>
              <div class="form-group"><label class="form-label">Descrição</label><input class="form-input" id="editProdDesc" value="${produto.descricao || ''}"></div>
              <button class="btn btn-primary" onclick="atualizarProduto(${produto.id}, ${categoriaId})">Salvar Alterações</button>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="modalEditOrcamento">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Editar Orçamento</div><button class="icon-btn" onclick="closeModal('modalEditOrcamento')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group form-check">
                <input type="checkbox" id="editOrcIndisponivel" onchange="toggleEditIndisponivel()">
                <label for="editOrcIndisponivel">Loja não tem o produto</label>
              </div>
              <div class="form-group" id="editOrcPrecoGroup">
                <label class="form-label">Preço (R$)</label>
                <input class="form-input" id="editOrcPreco" type="number" step="0.01" placeholder="0,00" inputmode="decimal">
              </div>
              <div class="form-group"><label class="form-label">Quantidade</label><input class="form-input" id="editOrcQtd" type="number" value="1" min="1"></div>
              <div class="form-group"><label class="form-label">Data do orçamento</label><input class="form-input" id="editOrcData" type="date"></div>
              <div class="form-group"><label class="form-label">Observação (opcional)</label><input class="form-input" id="editOrcObs" placeholder="Ex: Promoção válida até..."></div>
              <button class="btn btn-primary" onclick="atualizarOrcamento(${categoriaId}, ${produtoId})">Salvar Alterações</button>
            </div>
          </div>
        </div>`;

      document.getElementById('app').innerHTML = html;
    }

    async function renderRelatorios() {
      const categorias = await dbGetAll('categorias');
      const produtos = await dbGetAll('produtos');
      const orcamentos = await dbGetAll('orcamentos');
      const themeIcon = getTheme() === 'dark' ? ICONS.sun : ICONS.moon;

      const prodData = produtos.map(p => {
        const count = orcamentos.filter(o => o.produtoId === p.id).length;
        return { nome: p.nome, count };
      }).filter(p => p.count > 0).sort((a,b) => b.count - a.count).slice(0, 5);

      const maxCount = prodData.length > 0 ? prodData[0].count : 1;

      let html = `
        <div class="hero-compact">
          <div class="hero-top">
            <span class="hero-date">${getDataExtenso()}</span>
            <div class="hero-actions">
              <button class="hero-btn" onclick="toggleTheme()">${themeIcon}</button>
            </div>
          </div>
          <div class="hero-title">Relatórios</div>
          <div class="hero-sub">Análise e estatísticas dos seus orçamentos</div>
        </div>
        <div class="content">
      `;

      let totalGasto = 0, totalEconomia = 0, totalOrcs = orcamentos.length;
      for (const p of produtos) {
        const pos = orcamentos.filter(o => o.produtoId === p.id);
        const comprado = pos.find(o => o.comprado && !o.indisponivel);
        if (comprado) {
          totalGasto += comprado.preco;
          const precosDisp = pos.filter(o => !o.indisponivel).map(o => o.preco);
          if (precosDisp.length > 0) {
            totalEconomia += Math.max(...precosDisp) - comprado.preco;
          }
        }
      }

      html += `
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-value">${totalOrcs}</div>
            <div class="stat-label">Orçamentos</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${totalGasto > 0 ? formatMoney(totalGasto) : '—'}</div>
            <div class="stat-label">Melhor total</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${totalEconomia > 0 ? formatMoney(totalEconomia) : '—'}</div>
            <div class="stat-label">Economizado</div>
          </div>
        </div>
      `;

      if (prodData.length > 0) {
        html += `<div class="report-card"><div class="report-title">📊 Produtos mais orçados</div>`;
        const colors = ['var(--primary-500)', 'var(--primary-400)', 'var(--primary-300)', 'var(--primary-200)', 'var(--primary-100)'];
        for (let i = 0; i < prodData.length; i++) {
          const pct = (prodData[i].count / maxCount * 100).toFixed(0);
          html += `
            <div class="chart-bar">
              <div class="chart-label">${prodData[i].nome}</div>
              <div class="chart-track">
                <div class="chart-fill" style="width:${pct}%;background:${colors[i] || colors[colors.length-1]}"></div>
              </div>
              <div class="chart-value">${prodData[i].count}</div>
            </div>`;
        }
        html += `</div>`;
      }

      const semOrc = produtos.filter(p => !orcamentos.some(o => o.produtoId === p.id));
      if (semOrc.length > 0) {
        html += `<div class="report-card"><div class="report-title">⚠️ Produtos sem orçamento (${semOrc.length})</div>`;
        for (const p of semOrc) {
          const cat = categorias.find(c => c.id === p.categoriaId);
          html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;"><strong>${p.nome}</strong> <span style="color:var(--text-muted)">${cat ? '— ' + cat.nome : ''}</span></div>`;
        }
        html += `</div>`;
      }

      html += `</div>`;
      html += renderBottomNav('reports');
      document.getElementById('app').innerHTML = html;
    }

      if (state.view === 'home') openModal('modalCategoria');

        else openModal('modalFornecedor');
      }
      else if (state.view === 'produto') openModal('modalOrcamento');

    async function salvarCategoria() {
      const nome = document.getElementById('catNome').value.trim().toUpperCase();
      const tipo = document.getElementById('catTipo').value;
      const desc = document.getElementById('catDesc').value.trim().toUpperCase();
      if (!nome) { toast('Digite o nome da categoria', 'danger'); return; }
      await dbAdd('categorias', { nome, tipo, descricao: desc, criadoEm: Date.now() });
      closeModal('modalCategoria');
      toast('Categoria criada!', 'success');
      navigate('home');
    }
    async function atualizarCategoria(id) {
      const nome = document.getElementById('editCatNome').value.trim().toUpperCase();
      const desc = document.getElementById('editCatDesc').value.trim().toUpperCase();
      if (!nome) { toast('Digite o nome', 'danger'); return; }
      const cat = (await dbGetAll('categorias')).find(c => c.id === id);
      cat.nome = nome; cat.descricao = desc;
      await dbPut('categorias', cat);
      closeModal('modalEditCategoria'); toast('Categoria atualizada!', 'success');
      renderCategoria(id);
    }
    async function excluirCategoria(id) {
      if (!confirm('Excluir esta categoria e TODOS os produtos, fornecedores e orçamentos?')) return;
      const produtos = await dbGetByIndex('produtos', 'categoriaId', id);
      for (const p of produtos) {
        const orcs = await dbGetByIndex('orcamentos', 'produtoId', p.id);
        for (const o of orcs) await dbDelete('orcamentos', o.id);
        await dbDelete('produtos', p.id);
      }
      const forns = await dbGetByIndex('fornecedores', 'categoriaId', id);
      for (const f of forns) await dbDelete('fornecedores', f.id);
      await dbDelete('categorias', id);
      toast('Categoria excluída', 'success'); navigate('home');
    }

    async function salvarProduto(categoriaId) {
      const nome = document.getElementById('prodNome').value.trim().toUpperCase();
      const desc = document.getElementById('prodDesc').value.trim().toUpperCase();
      const sel = document.getElementById('prodUnidade');
      let unidade = sel.value === '__outro__' ? document.getElementById('prodUnidadeManual').value.trim().toUpperCase() : sel.value.toUpperCase();
      if (!nome) { toast('Digite o nome do produto', 'danger'); return; }
      if (!unidade) { toast('Digite a unidade', 'danger'); return; }
      await dbAdd('produtos', { categoriaId, nome, descricao: desc, unidade, criadoEm: Date.now() });
      closeModal('modalProduto'); toast('Produto adicionado!', 'success');
      document.getElementById('prodNome').value = '';
      document.getElementById('prodDesc').value = '';
      document.getElementById('prodUnidade').value = 'unidade';
      document.getElementById('prodUnidadeManual').value = '';
      document.getElementById('prodUnidadeManualGroup').style.display = 'none';
      renderCategoria(categoriaId);
    }
    async function atualizarProduto(id, categoriaId) {
      const nome = document.getElementById('editProdNome').value.trim().toUpperCase();
      const desc = document.getElementById('editProdDesc').value.trim().toUpperCase();
      if (!nome) { toast('Digite o nome', 'danger'); return; }
      const prod = (await dbGetAll('produtos')).find(p => p.id === id);
      prod.nome = nome; prod.descricao = desc;
      await dbPut('produtos', prod);
      closeModal('modalEditProduto'); toast('Produto atualizado!', 'success');
      renderProduto(categoriaId, id);
    }
    async function excluirProduto(id, categoriaId) {
      if (!confirm('Excluir este produto e todos os seus orçamentos?')) return;
      const orcs = await dbGetByIndex('orcamentos', 'produtoId', id);
      for (const o of orcs) await dbDelete('orcamentos', o.id);
      await dbDelete('produtos', id);
      toast('Produto excluído', 'success'); renderCategoria(categoriaId);
    }

    async function salvarFornecedor(categoriaId) {
      const nome = document.getElementById('fornNome').value.trim().toUpperCase();
      const telefone = document.getElementById('fornTel').value.trim();
      const endereco = document.getElementById('fornEnd').value.trim().toUpperCase();
      if (!nome) { toast('Digite o nome do fornecedor', 'danger'); return; }
      await dbAdd('fornecedores', { categoriaId, nome, telefone, endereco, criadoEm: Date.now() });
      closeModal('modalFornecedor'); toast('Fornecedor cadastrado!', 'success');
      document.getElementById('fornNome').value = '';
      document.getElementById('fornTel').value = '';
      document.getElementById('fornEnd').value = '';
      renderCategoria(categoriaId);
    }
    let editingFornId = null;
    async function editarFornecedor(id, categoriaId) {
      const f = (await dbGetAll('fornecedores')).find(x => x.id === id);
      editingFornId = id;
      document.getElementById('editFornNome').value = f.nome;
      document.getElementById('editFornTel').value = f.telefone || '';
      document.getElementById('editFornEnd').value = f.endereco || '';
      openModal('modalEditFornecedor');
    }
    async function atualizarFornecedor(categoriaId) {
      const nome = document.getElementById('editFornNome').value.trim().toUpperCase();
      const telefone = document.getElementById('editFornTel').value.trim();
      const endereco = document.getElementById('editFornEnd').value.trim().toUpperCase();
      if (!nome) { toast('Digite o nome do fornecedor', 'danger'); return; }
      const f = (await dbGetAll('fornecedores')).find(x => x.id === editingFornId);
      f.nome = nome; f.telefone = telefone; f.endereco = endereco;
      await dbPut('fornecedores', f);
      editingFornId = null;
      closeModal('modalEditFornecedor');
      toast('Fornecedor atualizado!', 'success');
      renderCategoria(categoriaId);
    }
    async function excluirFornecedor(id, categoriaId) {
      if (!confirm('Excluir este fornecedor?')) return;
      await dbDelete('fornecedores', id);
      toast('Fornecedor excluído', 'success'); renderCategoria(categoriaId);
    }

    async function salvarOrcamento(produtoId, categoriaId) {
      const sel = document.getElementById('orcFornecedorSelect');
      let fornecedor = sel.value === '__outro__' ? document.getElementById('orcFornecedorManual').value.trim().toUpperCase() : sel.value.toUpperCase();
      const indisponivel = document.getElementById('orcIndisponivel').checked;
      const precoRaw = document.getElementById('orcPreco').value.replace(',', '.');
      const preco = indisponivel ? 0 : parseFloat(precoRaw);
      const quantidade = parseInt(document.getElementById('orcQtd').value) || 1;
      const data = document.getElementById('orcData').value;
      const observacao = document.getElementById('orcObs').value.trim().toUpperCase();
      if (!fornecedor) { toast('Selecione ou digite o fornecedor', 'danger'); return; }
      if (!indisponivel && (isNaN(preco) || preco <= 0)) { toast('Digite um preço válido', 'danger'); return; }
      await dbAdd('orcamentos', { produtoId, fornecedor, preco, quantidade, data, observacao, indisponivel, comprado: false, criadoEm: Date.now() });
      closeModal('modalOrcamento'); toast('Orçamento salvo!', 'success');
      renderProduto(categoriaId, produtoId);
    }
    let editingOrcId = null;
    async function editarOrcamento(id, categoriaId, produtoId) {
      const o = (await dbGetAll('orcamentos')).find(x => x.id === id);
      editingOrcId = id;
      document.getElementById('editOrcPreco').value = o.preco || '';
      document.getElementById('editOrcQtd').value = o.quantidade;
      document.getElementById('editOrcData').value = o.data;
      document.getElementById('editOrcObs').value = o.observacao || '';
      document.getElementById('editOrcIndisponivel').checked = !!o.indisponivel;
      toggleEditIndisponivel();
      openModal('modalEditOrcamento');
    }
    async function atualizarOrcamento(categoriaId, produtoId) {
      const indisponivel = document.getElementById('editOrcIndisponivel').checked;
      const precoRaw = document.getElementById('editOrcPreco').value.replace(',', '.');
      const preco = indisponivel ? 0 : parseFloat(precoRaw);
      const quantidade = parseInt(document.getElementById('editOrcQtd').value) || 1;
      const data = document.getElementById('editOrcData').value;
      const observacao = document.getElementById('editOrcObs').value.trim().toUpperCase();
      if (!indisponivel && (isNaN(preco) || preco <= 0)) { toast('Preço inválido', 'danger'); return; }
      const o = (await dbGetAll('orcamentos')).find(x => x.id === editingOrcId);
      o.preco = preco; o.quantidade = quantidade; o.data = data; o.observacao = observacao; o.indisponivel = indisponivel;
      await dbPut('orcamentos', o);
      editingOrcId = null;
      closeModal('modalEditOrcamento');
      toast('Orçamento atualizado!', 'success');
      renderProduto(categoriaId, produtoId);
    }
    async function excluirOrcamento(id, categoriaId, produtoId) {
      if (!confirm('Excluir este orçamento?')) return;
      await dbDelete('orcamentos', id);
      toast('Orçamento excluído', 'success'); renderProduto(categoriaId, produtoId);
    }
    async function marcarComprado(orcId, categoriaId, produtoId) {
      const orcs = await dbGetByIndex('orcamentos', 'produtoId', produtoId);
      for (const o of orcs) {
        if (o.comprado) {
          o.comprado = false;
          await dbPut('orcamentos', o);
        }
      }
      const o = orcs.find(x => x.id === orcId);
      if (o) {
        o.comprado = true;
        await dbPut('orcamentos', o);
      }
      toast('Marcado como comprado!', 'success');
      renderProduto(categoriaId, produtoId);
    }

    async function exportData() {
      const data = {
        categorias: await dbGetAll('categorias'),
        produtos: await dbGetAll('produtos'),
        orcamentos: await dbGetAll('orcamentos'),
        fornecedores: await dbGetAll('fornecedores'),
        exportadoEm: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const fileName = `orcafacil-backup-${getHoje()}.json`;
      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([blob], fileName, { type: 'application/json' });
          await navigator.share({ files: [file], title: 'OrçaFácil Backup' });
          URL.revokeObjectURL(url); toast('Backup compartilhado!', 'success'); return;
        } catch (e) {}
      }
      const a = document.createElement('a'); a.href = url; a.download = fileName;
      a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      toast('Backup exportado!', 'success');
    }

    async function importData(input) {
      const file = input.files[0];
      if (!file) { toast('Nenhum arquivo selecionado', 'danger'); return; }
      toast('Importando...', 'info');
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        let count = 0;
        if (data.categorias && Array.isArray(data.categorias)) { for (const c of data.categorias) { await dbPut('categorias', c); count++; } }
        if (data.produtos && Array.isArray(data.produtos)) { for (const p of data.produtos) { await dbPut('produtos', p); count++; } }
        if (data.fornecedores && Array.isArray(data.fornecedores)) { for (const f of data.fornecedores) { await dbPut('fornecedores', f); count++; } }
        if (data.orcamentos && Array.isArray(data.orcamentos)) { for (const o of data.orcamentos) { await dbPut('orcamentos', o); count++; } }
        toast(`Backup importado! ${count} itens restaurados`, 'success');
        navigate('home');
      } catch (e) { console.error(e); toast('Erro ao importar: arquivo inválido', 'danger'); }
      input.value = '';
    }

    async function limparDados() {
      const stores = ['orcamentos', 'fornecedores', 'produtos', 'categorias'];
      for (const s of stores) {
        const all = await dbGetAll(s);
        for (const item of all) await dbDelete(s, item.id);
      }
      toast('Todos os dados foram apagados', 'success');
      navigate('home');
    }

    function switchTab(tab) { state.tab = tab; renderCategoria(state.categoriaId); }

    function navigate(view, categoriaId, produtoId) {
      const newState = { view, categoriaId, produtoId, tab: state.tab || 'produtos' };
      state = newState;
      if (view !== 'home' || navHistory.length === 0) {
        pushHistory(view, categoriaId, produtoId, state.tab);
      }
      if (view === 'home') renderHome();
      else if (view === 'categoria') renderCategoria(categoriaId);
      else if (view === 'produto') renderProduto(categoriaId, produtoId);
      else if (view === 'reports') renderRelatorios();
      else if (view === 'settings') renderConfiguracoes();
    }

    function refreshCurrentView() {
      if (state.view === 'home') renderHome();
      else if (state.view === 'categoria') renderCategoria(state.categoriaId);
      else if (state.view === 'produto') renderProduto(state.categoriaId, state.produtoId);
      else if (state.view === 'reports') renderRelatorios();
      else if (state.view === 'settings') renderConfiguracoes();
    }

    let swRegistration = null;
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            swRegistration = reg;
            setInterval(() => reg.update(), 30000);
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner();
                }
              });
            });
          })
          .catch(err => console.log('SW erro:', err));
      });
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data === 'UPDATE_AVAILABLE') {
          showUpdateBanner();
        }
      });
    }

    function showUpdateBanner() {
      const banner = document.getElementById('update-banner');
      if (banner) banner.classList.add('active');
    }
    function dismissUpdate() {
      const banner = document.getElementById('update-banner');
      if (banner) banner.classList.remove('active');
    }
    function applyUpdate() {
      if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage('SKIP_WAITING');
      }
      window.location.reload();
    }
    function checkForUpdate() {
      if (!('serviceWorker' in navigator)) {
        toast('Atualização não disponível neste navegador', 'warning');
        return;
      }
      toast('Verificando atualizações...', 'info');
      fetch('./index.html?_=' + Date.now(), { cache: 'no-store' })
        .then(r => r.text())
        .then(text => {
          const match = text.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
          const serverVersion = match ? match[1] : '1';
          const currentVersion = document.querySelector('meta[name="app-version"]')?.content || '1';
          if (serverVersion !== currentVersion) {
            showUpdateBanner();
          } else {
            toast('Você já está na versão mais recente!', 'success');
          }
        })
        .catch(() => toast('Sem conexão. Verifique sua internet.', 'warning'));
    }

    async function init() {
      await initDB();
      await seedData();
      renderHome();
    }
    init();
  </script>
</body>
</html>
