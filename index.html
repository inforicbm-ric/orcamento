<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrçaFácil - Controle de Orçamentos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f0f" id="themeMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0a0a0f; --surface: #12121a; --surface-raised: #1a1a28; --surface-hover: #222236; --surface-muted: #0f0f18;
      --border: #2a2a3e; --border-light: #353550;
      --text: #f0f0ff; --text-secondary: #a0a0c0; --text-muted: #606080;
      --accent: #6366f1; --accent-hover: #818cf8;
      --danger: #f43f5e; --danger-soft: rgba(244,63,94,0.15);
      --success: #10b981; --success-soft: rgba(16,185,129,0.15);
      --warning: #f59e0b; --warning-soft: rgba(245,158,11,0.15);
      --info: #0ea5e9; --info-soft: rgba(14,165,233,0.15);
      --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg: #f8f7ff; --surface: #ffffff; --surface-raised: #f0eeff; --surface-hover: #e8e5ff; --surface-muted: #faf9ff;
      --border: #d4d0ff; --border-light: #e2dfff;
      --text: #1e1b4b; --text-secondary: #6b66a0; --text-muted: #a09cc0;
      --accent: #6366f1; --accent-hover: #4f46e5;
      --danger: #e11d48; --danger-soft: rgba(225,29,72,0.1);
      --success: #059669; --success-soft: rgba(5,150,105,0.1);
      --warning: #d97706; --warning-soft: rgba(217,119,6,0.1);
      --info: #0284c7; --info-soft: rgba(2,132,199,0.1);
      --shadow: 0 8px 32px rgba(99,102,241,0.12);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
      -webkit-font-smoothing: antialiased; transition: background 0.3s ease, color 0.3s ease;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--surface-raised); color: var(--text); border-color: var(--accent); }
    .icon-btn svg { width: 18px; height: 18px; }
    .content { padding: 14px 16px 100px; }

    /* Busca */
    .search-box { position: relative; margin-bottom: 14px; }
    .search-input {
      width: 100%; padding: 13px 14px 13px 44px;
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-md); color: var(--text);
      font-size: 15px; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--info-soft); }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--accent); pointer-events: none; opacity: 0.8;
    }
    .search-filters { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .search-select {
      padding: 9px 12px; border-radius: var(--radius-sm);
      border: 2px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 13px; font-family: inherit;
    }
    .search-results {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-md); overflow: hidden;
      margin-bottom: 16px; max-height: 320px; overflow-y: auto;
    }
    .search-result-item {
      padding: 12px 14px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--surface-hover); }
    .search-result-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-meta { font-size: 12px; color: var(--text-secondary); }
    .search-result-price { font-size: 14px; font-weight: 800; color: var(--success); white-space: nowrap; }
    .search-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

    /* Cards */
    .card {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-md); padding: 14px;
      margin-bottom: 10px; transition: all 0.15s ease; cursor: pointer;
    }
    .card:hover { border-color: var(--accent); background: var(--surface-raised); transform: translateY(-1px); box-shadow: var(--shadow); }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .card-icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .card-title { font-size: 15px; font-weight: 800; }
    .card-meta { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .card-stat { font-size: 12px; color: var(--text-secondary); }
    .card-stat strong { color: var(--text); font-weight: 700; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 12px;
      border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-info { background: var(--info-soft); color: var(--info); }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat-box {
      border-radius: var(--radius-md); padding: 14px 8px; text-align: center;
      border: 2px solid transparent; position: relative; overflow: hidden;
    }
    .stat-box::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: 0.08; z-index: 0;
    }
    .stat-value { font-size: 20px; font-weight: 800; position: relative; z-index: 1; }
    .stat-label { font-size: 10px; font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; z-index: 1; }

    /* Stat colors */
    .stat-success { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05)); border-color: rgba(16,185,129,0.3); }
    .stat-success .stat-value { color: #10b981; }
    .stat-success .stat-label { color: #34d399; }
    .stat-danger { background: linear-gradient(135deg, rgba(244,63,94,0.15), rgba(244,63,94,0.05)); border-color: rgba(244,63,94,0.3); }
    .stat-danger .stat-value { color: #f43f5e; }
    .stat-danger .stat-label { color: #fb7185; }
    .stat-warning { background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(245,158,11,0.05)); border-color: rgba(245,158,11,0.3); }
    .stat-warning .stat-value { color: #f59e0b; }
    .stat-warning .stat-label { color: #fbbf24; }

    [data-theme="light"] .stat-success .stat-value { color: #059669; }
    [data-theme="light"] .stat-success .stat-label { color: #10b981; }
    [data-theme="light"] .stat-danger .stat-value { color: #e11d48; }
    [data-theme="light"] .stat-danger .stat-label { color: #f43f5e; }
    [data-theme="light"] .stat-warning .stat-value { color: #d97706; }
    [data-theme="light"] .stat-warning .stat-label { color: #f59e0b; }

    /* Section */
    .section-title {
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .section-title a { color: var(--accent); font-size: 12px; text-transform: none; letter-spacing: 0; cursor: pointer; font-weight: 700; }

    /* FAB */
    .fab {
      position: fixed; bottom: 20px; right: 20px;
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4); transition: all 0.2s ease;
      z-index: 200;
    }
    .fab:hover { transform: scale(1.08) rotate(90deg); box-shadow: 0 12px 32px rgba(99,102,241,0.5); }
    .fab svg { width: 24px; height: 24px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 300; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface); width: 100%; max-width: 480px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border: 2px solid var(--border); border-bottom: none;
      max-height: 85vh; overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-body { padding: 16px 20px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 12px 14px;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 15px; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--info-soft);
    }
    .form-textarea { min-height: 70px; resize: vertical; }
    .btn {
      width: 100%; padding: 14px; border-radius: var(--radius-sm);
      border: none; background: var(--surface-raised);
      color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .btn:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(99,102,241,0.4); transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #e11d48); color: #fff; }
    .btn-danger:hover { box-shadow: 0 4px 16px rgba(244,63,94,0.3); }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; }

    /* Orçamento item */
    .orc-item {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
      transition: all 0.15s;
    }
    .orc-item:hover { border-color: var(--accent); transform: translateX(2px); }
    .orc-item.best { border-color: var(--success); background: var(--success-soft); box-shadow: 0 0 12px rgba(16,185,129,0.15); }
    .orc-rank {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0;
      background: var(--surface-raised); color: var(--text-secondary);
    }
    .orc-rank.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .orc-rank.silver { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
    .orc-rank.bronze { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
    .orc-info { flex: 1; min-width: 0; }
    .orc-fornecedor { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .orc-detalhes { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
    .orc-preco { font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap; }
    .orc-preco.best { color: var(--success); }
    .orc-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .orc-item:hover .orc-actions { opacity: 1; }
    .orc-actions .icon-btn { width: 30px; height: 30px; }

    /* Fornecedor item */
    .forn-item {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-md); padding: 11px 14px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
      transition: all 0.15s;
    }
    .forn-item:hover { border-color: var(--accent); transform: translateX(2px); }
    .forn-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: #fff; }
    .forn-info { flex: 1; min-width: 0; }
    .forn-nome { font-size: 14px; font-weight: 700; }
    .forn-contato { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
    .forn-actions { display: flex; gap: 3px; opacity: 0; transition: opacity 0.15s; }
    .forn-item:hover .forn-actions { opacity: 1; }

    /* Empty */
    .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); }
    .empty-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.5; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-bottom: 3px; }
    .empty-text { font-size: 13px; }

    /* Breadcrumb */
    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px; font-size: 12px;
      color: var(--text-secondary); border-bottom: 1px solid var(--border);
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-muted); }

    /* Toast */
    .toast-container {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 400; display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface-raised); border: 2px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 20px;
      font-size: 13px; font-weight: 700; box-shadow: var(--shadow);
      pointer-events: auto; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 2px solid var(--border); }
    .tab {
      padding: 10px 14px; font-size: 13px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: all 0.15s; white-space: nowrap;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Theme toggle */
    .theme-toggle {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      border: 2px solid var(--border); background: var(--surface);
      color: var(--accent); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-raised); border-color: var(--accent); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (min-width: 768px) { .app { max-width: 560px; } .fab { right: calc(50% - 240px); } }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const DB_NAME = 'OrcaFacilDB'; const DB_VERSION = 3; let db = null;

    const ICONS = {

      pill: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l10-10a4.95 4.95 0 00-7-7l-10 10a4.95 4.95 0 007 7Z"/><path d="M8.5 8.5l7 7"/></svg>`,
      hammer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12l-8.5 8.5a2.12 2.12 0 01-3-3L12 9"/><path d="M17.5 9.5L22 5l-3-3-4.5 4.5"/><path d="M11 5L8 2l-3 3 3 3"/></svg>`,

      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8f7ff' : '#0a0a0f');

    function normalize(str) {
      return str.toString().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u030f]/g, '')
        .replace(/[^a-z0-9\s]/g, '').trim();
    }
    function searchMatches(query, text) {
      const q = normalize(query); const t = normalize(text);
      return q.split(/\s+/).every(part => t.includes(part));
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('categorias')) d.createObjectStore('categorias', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('produtos')) {
            const s = d.createObjectStore('produtos', { keyPath: 'id', autoIncrement: true });
            s.createIndex('categoriaId', 'categoriaId', { unique: false });
          }
          if (!d.objectStoreNames.contains('orcamentos')) {
            const s = d.createObjectStore('orcamentos', { keyPath: 'id', autoIncrement: true });
            s.createIndex('produtoId', 'produtoId', { unique: false });
          }
          if (!d.objectStoreNames.contains('fornecedores')) {
            const s = d.createObjectStore('fornecedores', { keyPath: 'id', autoIncrement: true });
            s.createIndex('categoriaId', 'categoriaId', { unique: false });
          }
        };
      });
    }

    function dbGetAll(store) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbGetByIndex(store, indexName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).index(indexName).getAll(value);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbAdd(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).add(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbPut(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbDelete(store, id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function doSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const catFilter = document.getElementById('searchCat').value;
      const container = document.getElementById('searchResults');
      if (!query) { container.innerHTML = ''; return; }
      const produtos = await dbGetAll('produtos');
      const categorias = await dbGetAll('categorias');
      const orcamentos = await dbGetAll('orcamentos');
      let results = produtos.filter(p => {
        if (catFilter && p.categoriaId !== parseInt(catFilter)) return false;
        return searchMatches(query, p.nome) || (p.descricao && searchMatches(query, p.descricao));
      });
      if (results.length === 0) { container.innerHTML = `<div class="search-empty">Nenhum produto encontrado</div>`; return; }
      let html = '<div class="search-results">';
      for (const prod of results) {
        const cat = categorias.find(c => c.id === prod.categoriaId);
        const prodOrcs = orcamentos.filter(o => o.produtoId === prod.id);
        const menorPreco = prodOrcs.length > 0 ? Math.min(...prodOrcs.map(o => o.preco)) : null;
        const info = cat ? (CATEGORIA_ICONS[cat.tipo] || CATEGORIA_ICONS.outros) : CATEGORIA_ICONS.outros;
        html += `
          <div class="search-result-item" onclick="navigate('produto', ${prod.categoriaId}, ${prod.id})">
            <div class="search-result-icon" style="background:${info.bg};color:${info.color}">${info.emoji}</div>
            <div class="search-result-info">
              <div class="search-result-name">${prod.nome}</div>
              <div class="search-result-meta">${cat ? cat.nome : ''}${prod.descricao ? ' · ' + prod.descricao : ''}</div>
            </div>
            ${menorPreco !== null ? `<div class="search-result-price">${formatMoney(menorPreco)}</div>` : ''}
          </div>`;
      }
      html += '</div>';
      container.innerHTML = html;
    }

              <div class="modal-body">
                <div class="form-group"><label class="form-label">Nome da Loja / Fornecedor</label><input class="form-input" id="fornNome" placeholder="Ex: Drogaria São Paulo"></div>
                <div class="form-group"><label class="form-label">Telefone (opcional)</label><input class="form-input" id="fornTel" placeholder="Ex: (11) 99999-9999"></div>
                <div class="form-group"><label class="form-label">Endereço (opcional)</label><input class="form-input" id="fornEnd" placeholder="Ex: Rua das Flores, 123"></div>
                <button class="btn btn-primary" onclick="salvarFornecedor(${categoria.id})">Cadastrar Fornecedor</button>
              </div>
            </div>
          </div>`;
      }

      html += `
        <div class="modal-overlay" id="modalEditCategoria">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Editar Categoria</div><button class="icon-btn" onclick="closeModal('modalEditCategoria')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="editCatNome" value="${categoria.nome}"></div>
              <div class="form-group"><label class="form-label">Descrição</label><input class="form-input" id="editCatDesc" value="${categoria.descricao || ''}"></div>
              <button class="btn btn-primary" onclick="atualizarCategoria(${categoria.id})">Salvar Alterações</button>
            </div>
          </div>
        </div>`;

      document.getElementById('app').innerHTML = html;
    }

    async function renderProduto(categoriaId, produtoId) {
      const categoria = (await dbGetAll('categorias')).find(c => c.id === categoriaId);
      const produto = (await dbGetAll('produtos')).find(p => p.id === produtoId);
      const orcamentos = await dbGetByIndex('orcamentos', 'produtoId', produtoId);
      const fornecedores = await dbGetByIndex('fornecedores', 'categoriaId', categoriaId);
      const sorted = [...orcamentos].sort((a, b) => a.preco - b.preco);
      const info = CATEGORIA_ICONS[categoria.tipo] || CATEGORIA_ICONS.outros;
      const hoje = new Date().toISOString().split('T')[0];
      const themeIcon = getTheme() === 'dark' ? ICONS.sun : ICONS.moon;

      let fornOptions = '<option value="">-- Selecione uma loja --</option>';
      for (const f of fornecedores) fornOptions += `<option value="${f.nome}">${f.nome}</option>`;
      fornOptions += '<option value="__outro__">✏️ Outro (digitar manualmente)</option>';

      let html = `
        <div class="header">
          <div class="header-actions"><button class="icon-btn" onclick="navigate('categoria', ${categoriaId})">${ICONS.back}</button></div>
          <div class="header-title" style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">${produto.nome}</div>
          <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">${themeIcon}</button>
            <button class="icon-btn" onclick="openModal('modalEditProduto')" title="Editar">${ICONS.edit}</button>
            <button class="icon-btn" onclick="excluirProduto(${produto.id}, ${categoriaId})" title="Excluir">${ICONS.trash}</button>
          </div>
        </div>
        <div class="breadcrumb">
          <a onclick="navigate('home')">Início</a><span class="breadcrumb-sep">›</span>
          <a onclick="navigate('categoria', ${categoriaId})">${categoria.nome}</a><span class="breadcrumb-sep">›</span><span>${produto.nome}</span>
        </div>
        <div class="content">
      `;

      if (sorted.length > 0) {
        const menor = sorted[0].preco; const maior = sorted[sorted.length - 1].preco; const economia = maior - menor;
        html += `
          <div class="stats-row">
            <div class="stat-box stat-success">
              <div class="stat-value">${formatMoney(menor)}</div>
              <div class="stat-label">💚 Menor preço</div>
            </div>
            <div class="stat-box stat-danger">
              <div class="stat-value">${formatMoney(maior)}</div>
              <div class="stat-label">❤️ Maior preço</div>
            </div>
            <div class="stat-box stat-warning">
              <div class="stat-value">${formatMoney(economia)}</div>
              <div class="stat-label">💰 Economia</div>
            </div>
          </div>`;
      }

      html += `<div class="section-title">Orçamentos (${sorted.length})</div>`;

      if (sorted.length === 0) {
        html += `<div class="empty"><div class="empty-icon">🏷️</div><div class="empty-title">Nenhum orçamento</div><div class="empty-text">Adicione orçamentos de diferentes fornecedores</div></div>`;
      } else {
        sorted.forEach((o, i) => {
          const rank = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          const isBest = i === 0;
          html += `
            <div class="orc-item ${isBest ? 'best' : ''}">
              <div class="orc-rank ${rank}">${i + 1}º</div>
              <div class="orc-info">
                <div class="orc-fornecedor">${o.fornecedor}</div>
                <div class="orc-detalhes">${o.quantidade > 1 ? o.quantidade + ' ' + produto.unidade + 's · ' : ''}${o.data}${o.observacao ? ' · ' + o.observacao : ''}</div>
              </div>
              <div class="orc-preco ${isBest ? 'best' : ''}">${formatMoney(o.preco)}</div>
              <div class="orc-actions">
                <button class="icon-btn" onclick="editarOrcamento(${o.id}, ${categoriaId}, ${produtoId})" title="Editar">${ICONS.edit}</button>
                <button class="icon-btn" onclick="excluirOrcamento(${o.id}, ${categoriaId}, ${produtoId})" title="Excluir">${ICONS.trash}</button>
              </div>
            </div>`;
        });
      }

      html += `</div><button class="fab" onclick="openModal('modalOrcamento')">${ICONS.plus}</button>`;

      html += `
        <div class="modal-overlay" id="modalOrcamento">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Novo Orçamento</div><button class="icon-btn" onclick="closeModal('modalOrcamento')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group"><label class="form-label">Fornecedor / Loja</label>
                <select class="form-select" id="orcFornecedorSelect" onchange="toggleFornecedorManual()">${fornOptions}</select>
              </div>
              <div class="form-group" id="orcFornManualGroup" style="display:none;">
                <label class="form-label">Digite o nome do fornecedor</label>
                <input class="form-input" id="orcFornecedorManual" placeholder="Ex: Drogaria Nova">
              </div>
              <div class="form-group"><label class="form-label">Preço (R$)</label><input class="form-input" id="orcPreco" type="number" step="0.01" placeholder="0,00"></div>
              <div class="form-group"><label class="form-label">Quantidade</label><input class="form-input" id="orcQtd" type="number" value="1" min="1"></div>
              <div class="form-group"><label class="form-label">Data do orçamento</label><input class="form-input" id="orcData" type="date" value="${hoje}"></div>
              <div class="form-group"><label class="form-label">Observação (opcional)</label><input class="form-input" id="orcObs" placeholder="Ex: Promoção válida até..."></div>
              <button class="btn btn-primary" onclick="salvarOrcamento(${produtoId}, ${categoriaId})">Salvar Orçamento</button>
            </div>
          </div>
        </div>`;

      html += `
        <div class="modal-overlay" id="modalEditProduto">
          <div class="modal">
            <div class="modal-header"><div class="modal-title">Editar Produto</div><button class="icon-btn" onclick="closeModal('modalEditProduto')">${ICONS.close}</button></div>
            <div class="modal-body">
              <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="editProdNome" value="${produto.nome}"></div>
              <div class="form-group"><label class="form-label">Descrição</label><input class="form-input" id="editProdDesc" value="${produto.descricao || ''}"></div>
              <button class="btn btn-primary" onclick="atualizarProduto(${produto.id}, ${categoriaId})">Salvar Alterações</button>
            </div>
          </div>
        </div>`;

      document.getElementById('app').innerHTML = html;
    }

    function toggleFornecedorManual() {
      const sel = document.getElementById('orcFornecedorSelect');
      const grp = document.getElementById('orcFornManualGroup');
      grp.style.display = sel.value === '__outro__' ? 'block' : 'none';
    }

    async function salvarCategoria() {
      const nome = document.getElementById('catNome').value.trim();
      const tipo = document.getElementById('catTipo').value;
      const desc = document.getElementById('catDesc').value.trim();
      if (!nome) { toast('Digite o nome da categoria', 'danger'); return; }
      await dbAdd('categorias', { nome, tipo, descricao: desc, criadoEm: Date.now() });
      closeModal('modalCategoria'); toast('Categoria criada!', 'success'); renderHome();
    }

    async function atualizarCategoria(id) {
      const nome = document.getElementById('editCatNome').value.trim();
      const desc = document.getElementById('editCatDesc').value.trim();
      if (!nome) { toast('Digite o nome', 'danger'); return; }
      const cat = (await dbGetAll('categorias')).find(c => c.id === id);
      cat.nome = nome; cat.descricao = desc;
      await dbPut('categorias', cat);
      closeModal('modalEditCategoria'); toast('Categoria atualizada!', 'success'); renderCategoria(id);
    }

    async function excluirCategoria(id) {
      if (!confirm('Excluir esta categoria e TODOS os produtos, fornecedores e orçamentos?')) return;
      const produtos = await dbGetByIndex('produtos', 'categoriaId', id);
      for (const p of produtos) {
        const orcs = await dbGetByIndex('orcamentos', 'produtoId', p.id);
        for (const o of orcs) await dbDelete('orcamentos', o.id);
        await dbDelete('produtos', p.id);
      }
      const forns = await dbGetByIndex('fornecedores', 'categoriaId', id);
      for (const f of forns) await dbDelete('fornecedores', f.id);
      await dbDelete('categorias', id);
      toast('Categoria excluída', 'success'); navigate('home');
    }

    async function salvarProduto(categoriaId) {
      const nome = document.getElementById('prodNome').value.trim();
      const desc = document.getElementById('prodDesc').value.trim();
      const unidade = document.getElementById('prodUnidade').value;
      if (!nome) { toast('Digite o nome do produto', 'danger'); return; }
      await dbAdd('produtos', { categoriaId, nome, descricao: desc, unidade, criadoEm: Date.now() });
      closeModal('modalProduto'); toast('Produto adicionado!', 'success'); renderCategoria(categoriaId);
    }

    async function atualizarProduto(id, categoriaId) {
      const nome = document.getElementById('editProdNome').value.trim();
      const desc = document.getElementById('editProdDesc').value.trim();
      if (!nome) { toast('Digite o nome', 'danger'); return; }
      const prod = (await dbGetAll('produtos')).find(p => p.id === id);
      prod.nome = nome; prod.descricao = desc;
      await dbPut('produtos', prod);
      closeModal('modalEditProduto'); toast('Produto atualizado!', 'success'); renderProduto(categoriaId, id);
    }

    async function excluirProduto(id, categoriaId) {
      if (!confirm('Excluir este produto e todos os seus orçamentos?')) return;
      const orcs = await dbGetByIndex('orcamentos', 'produtoId', id);
      for (const o of orcs) await dbDelete('orcamentos', o.id);
      await dbDelete('produtos', id);
      toast('Produto excluído', 'success'); renderCategoria(categoriaId);
    }

    async function salvarFornecedor(categoriaId) {
      const nome = document.getElementById('fornNome').value.trim();
      const telefone = document.getElementById('fornTel').value.trim();
      const endereco = document.getElementById('fornEnd').value.trim();
      if (!nome) { toast('Digite o nome do fornecedor', 'danger'); return; }
      await dbAdd('fornecedores', { categoriaId, nome, telefone, endereco, criadoEm: Date.now() });
      closeModal('modalFornecedor'); toast('Fornecedor cadastrado!', 'success');
      document.getElementById('fornNome').value = '';
      document.getElementById('fornTel').value = '';
      document.getElementById('fornEnd').value = '';
      renderCategoria(categoriaId);
    }

    async function editarFornecedor(id, categoriaId) {
      const f = (await dbGetAll('fornecedores')).find(x => x.id === id);
      const novoNome = prompt('Nome:', f.nome);
      if (novoNome === null) return;
      if (!novoNome.trim()) { toast('Nome inválido', 'danger'); return; }
      const novoTel = prompt('Telefone:', f.telefone || '');
      if (novoTel === null) return;
      const novoEnd = prompt('Endereço:', f.endereco || '');
      if (novoEnd === null) return;
      f.nome = novoNome.trim(); f.telefone = novoTel.trim(); f.endereco = novoEnd.trim();
      await dbPut('fornecedores', f);
      toast('Fornecedor atualizado!', 'success'); renderCategoria(categoriaId);
    }

    async function excluirFornecedor(id, categoriaId) {
      if (!confirm('Excluir este fornecedor?')) return;
      await dbDelete('fornecedores', id);
      toast('Fornecedor excluído', 'success'); renderCategoria(categoriaId);
    }

    async function salvarOrcamento(produtoId, categoriaId) {
      const sel = document.getElementById('orcFornecedorSelect');
      let fornecedor = sel.value === '__outro__' ? document.getElementById('orcFornecedorManual').value.trim() : sel.value;
      const preco = parseFloat(document.getElementById('orcPreco').value);
      const quantidade = parseInt(document.getElementById('orcQtd').value) || 1;
      const data = document.getElementById('orcData').value;
      const observacao = document.getElementById('orcObs').value.trim();
      if (!fornecedor) { toast('Selecione ou digite o fornecedor', 'danger'); return; }
      if (isNaN(preco) || preco <= 0) { toast('Digite um preço válido', 'danger'); return; }
      await dbAdd('orcamentos', { produtoId, fornecedor, preco, quantidade, data, observacao, criadoEm: Date.now() });
      closeModal('modalOrcamento'); toast('Orçamento salvo!', 'success'); renderProduto(categoriaId, produtoId);
    }

    async function editarOrcamento(id, categoriaId, produtoId) {
      const o = (await dbGetAll('orcamentos')).find(x => x.id === id);
      const novoPreco = prompt('Novo preço (R$):', o.preco);
      if (novoPreco === null) return;
      const preco = parseFloat(novoPreco);
      if (isNaN(preco) || preco <= 0) { toast('Preço inválido', 'danger'); return; }
      o.preco = preco; await dbPut('orcamentos', o);
      toast('Orçamento atualizado!', 'success'); renderProduto(categoriaId, produtoId);
    }

    async function excluirOrcamento(id, categoriaId, produtoId) {
      if (!confirm('Excluir este orçamento?')) return;
      await dbDelete('orcamentos', id);
      toast('Orçamento excluído', 'success'); renderProduto(categoriaId, produtoId);
    }

    async function exportData() {
      const data = {
        categorias: await dbGetAll('categorias'),
        produtos: await dbGetAll('produtos'),
        orcamentos: await dbGetAll('orcamentos'),
        fornecedores: await dbGetAll('fornecedores'),
        exportadoEm: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const fileName = `orcafacil-backup-${new Date().toISOString().split('T')[0]}.json`;
      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([blob], fileName, { type: 'application/json' });
          await navigator.share({ files: [file], title: 'OrçaFácil Backup' });
          URL.revokeObjectURL(url); toast('Backup compartilhado!', 'success'); return;
        } catch (e) {}
      }
      const a = document.createElement('a'); a.href = url; a.download = fileName;
      a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      toast('Backup exportado!', 'success');
    }

    async function importData(input) {
      const file = input.files[0];
      if (!file) { toast('Nenhum arquivo selecionado', 'danger'); return; }
      toast('Importando...', 'info');
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        let count = 0;
        if (data.categorias && Array.isArray(data.categorias)) { for (const c of data.categorias) { await dbPut('categorias', c); count++; } }
        if (data.produtos && Array.isArray(data.produtos)) { for (const p of data.produtos) { await dbPut('produtos', p); count++; } }
        if (data.fornecedores && Array.isArray(data.fornecedores)) { for (const f of data.fornecedores) { await dbPut('fornecedores', f); count++; } }
        if (data.orcamentos && Array.isArray(data.orcamentos)) { for (const o of data.orcamentos) { await dbPut('orcamentos', o); count++; } }
        toast(`Backup importado! ${count} itens restaurados`, 'success'); navigate('home');
      } catch (e) { console.error(e); toast('Erro ao importar: arquivo inválido', 'danger'); }
      input.value = '';
    }

    function switchTab(tab) { state.tab = tab; renderCategoria(state.categoriaId); }

    function navigate(view, categoriaId, produtoId) {
      state = { view, categoriaId, produtoId, tab: state.tab || 'produtos' };
      if (view === 'home') renderHome();
      else if (view === 'categoria') renderCategoria(categoriaId);
      else if (view === 'produto') renderProduto(categoriaId, produtoId);
    }

    async function init() {
      await initDB(); await seedData(); renderHome();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
    init();
  </script>
</body>
</html>
